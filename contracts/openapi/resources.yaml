openapi: 3.1.0
info:
  title: "EduBridge LMP API: Resources"
  version: 0.1.0
  description: |
    Training materials (RES-1..4). Zod mirror: src/lib/api/schemas/resources.ts. Mock: src/mocks/handlers/resources.ts.
    Rules mirrored in src/lib/domain/resources.ts.

    - RES-1: an instructor of a training adds a FILE (uploaded first with purpose RESOURCE, uploads.yaml) or a LINK (http/https).
    - RES-2 audience, exactly one of:
        TRAINING: every CONFIRMED learner of the training's cohorts plus this instructor's 1:1 learners on it
        COHORT:   CONFIRMED learners of one of the instructor's cohorts on this training
        SESSION:  learners of one class of such a cohort (sessions.yaml id)
        LEARNER:  one of the instructor's 1:1 learners on this training (a booking ACCEPTED, RESCHEDULE_REQUESTED, COMPLETED or NO_SHOW)
      Ids the scope doesn't use are dropped. Anything else is 422 (field_errors.scope). Learners who can see a new resource
      get RESOURCE_ADDED. Archived trainings keep their resources for enrolled learners (TRN-7).
    - RES-3: optional folder name; order by position. Reorder takes one folder's ids in the new order (buttons in the UI, so
      no dragging is needed: WCAG 2.2 2.5.7).
    - RES-4: files up to 100 MB (pdf, docx, pptx, xlsx, jpeg, png, webp), virus-scanned; learners only get files whose scan
      is CLEAN, via a signed URL. Unlike recordings, downloads are allowed.
    - Writes are refused while an admin views as the instructor.
servers:
  - url: /api/v1
paths:
  /teach/trainings:
    get:
      summary: Trainings I teach (INSTRUCTOR), not drafts
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [id, title, modality_code], properties: { id: { type: string }, title: { type: string }, modality_code: { type: string } } } }
  /teach/trainings/{id}/audiences:
    get:
      summary: What I can target on this training (my cohorts with their classes, my 1:1 learners) and the folders in use
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                type: object
                required: [cohorts, learners, folders]
                properties:
                  cohorts:
                    type: array
                    items:
                      type: object
                      required: [id, name, sessions]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        sessions: { type: array, items: { type: object, required: [id, start_utc], properties: { id: { type: string }, start_utc: { type: string } } } }
                  learners: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } }
                  folders: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
  /teach/resources:
    get:
      summary: My resources (INSTRUCTOR), by position
      parameters: [{ name: training_id, in: query, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/ResourceList" }
    post:
      summary: Add a resource and notify its audience
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/ResourceResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /teach/resources/reorder:
    post:
      summary: New order for one folder's resources (422 if the ids span folders or aren't mine)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 1, items: { type: string } } } } } } }
      responses:
        "200": { $ref: "#/components/responses/ResourceList" }
        "422": { $ref: "#/components/responses/Error" }
  /resources/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Edit title, note, folder, link or audience (the file itself can't be swapped; add a new one)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/ResourceResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove it for everyone
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /me/resources:
    get:
      summary: Resources shared with me (LEARNER), by position; files only once scanned clean
      parameters: [{ name: training_id, in: query, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/ResourceList" }
components:
  responses:
    Error:
      description: Error body per CONVENTIONS.md
      content: { application/json: { schema: { $ref: "./catalog.yaml#/components/schemas/Error" } } }
    ResourceList:
      description: List
      content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Resource" } } } } } }
    ResourceResponse:
      description: Resource
      content: { application/json: { schema: { type: object, required: [resource], properties: { resource: { $ref: "#/components/schemas/Resource" } } } } }
  schemas:
    Audience:
      type: object
      required: [scope, cohort_id, session_id, learner_id]
      properties:
        scope: { type: string, enum: [TRAINING, COHORT, SESSION, LEARNER] }
        cohort_id: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        learner_id: { type: [string, "null"] }
    ResourceInput:
      allOf:
        - { $ref: "#/components/schemas/Audience" }
        - type: object
          required: [training_id, kind, title, description, folder, file_id, link_url]
          properties:
            training_id: { type: string }
            kind: { type: string, enum: [FILE, LINK] }
            title: { type: string, minLength: 2, maxLength: 120 }
            description: { type: [string, "null"], maxLength: 500 }
            folder: { type: [string, "null"], maxLength: 60 }
            file_id: { type: [string, "null"], description: "FILE: an uploaded, CLEAN file with purpose RESOURCE" }
            link_url: { type: [string, "null"], format: uri, description: "LINK: http or https" }
    Resource:
      allOf:
        - { $ref: "#/components/schemas/Audience" }
        - type: object
          required: [id, training_id, kind, title, description, folder, position, file, link_url, audience_label, created_at]
          properties:
            id: { type: string }
            training_id: { type: string }
            kind: { type: string, enum: [FILE, LINK] }
            title: { type: string }
            description: { type: [string, "null"] }
            folder: { type: [string, "null"] }
            position: { type: integer }
            file: { oneOf: [{ $ref: "./uploads.yaml#/components/schemas/StoredFile" }, { type: "null" }] }
            link_url: { type: [string, "null"] }
            audience_label: { type: string, description: "Plain words, e.g. 'Autumn cohort' or 'Ada Demo (one-on-one)'" }
            created_at: { type: string, format: date-time }
