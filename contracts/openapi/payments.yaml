openapi: 3.1.0
info:
  title: "EduBridge LMP API: Checkout and payments"
  version: 0.1.0
  description: |
    Cohort checkout (COH-2, PRC-7, PAY-1/2). Zod mirror: src/lib/api/schemas/payments.ts.
    Mock: src/mocks/handlers/checkout.ts (with a stand-in for Stripe's hosted page at /mock-gateway).

    Flow (Stripe Checkout, plan D8):
    1. GET /checkout/cohorts/{id}: breakdown + whether the learner can buy (`blocked`).
    2. POST /checkout/sessions with an Idempotency-Key: the backend creates an Enrolment (PENDING_PAYMENT),
       a Payment (PENDING) and a Stripe Checkout Session in `payment` mode for `breakdown.total`, with
       success_url = {APP}/checkout/return?payment_id={id} and cancel_url = {APP}/checkout/cohort/{cohort_id}?cancelled=1.
       It returns `checkout_url` (the Stripe-hosted page). No card data reaches EduBridge (PAY-1).
    3. Stripe webhook `checkout.session.completed` (signature-verified) → Payment CAPTURED with `method`
       ("Visa ending 4242"), Enrolment CONFIRMED, cohort enrolled_count + 1 (FULL at capacity), confirmation email.
       `checkout.session.expired` / payment failure → Payment FAILED or VOIDED, Enrolment CANCELLED. The browser
       returning to success_url changes nothing (PAY-2).
    4. The return page polls GET /payments/{id} every 1.5 s while PENDING.

    Seats aren't held during payment. If the cohort filled while the learner was on Stripe, the webhook
    handler refunds in full immediately (Payment REFUNDED, Enrolment REFUNDED, `failure_message` explains).
    Receipts (PAY-6): on capture the backend assigns a sequential `receipt_number` (EB-YYYY-NNNNN, never
    reused), renders a PDF, emails it, and exposes it as a signed, short-lived `receipt_url`. The app also
    shows the receipt at /receipts/{payment_id} from the payment record.
servers:
  - url: /api/v1
paths:
  /checkout/cohorts/{id}:
    get:
      summary: Quote for one seat in a visible cohort, for the signed-in LEARNER (PRC-7)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Quote, content: { application/json: { schema: { $ref: "#/components/schemas/CohortCheckout" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /checkout/sessions:
    post:
      summary: Start paying for a seat (PAY-1/2). Same Idempotency-Key returns the same session (PAY-8)
      description: |
        409 with code ALREADY_ENROLLED, FULL, NOT_OPEN, DEADLINE_PASSED or NO_PRICE when `blocked` would be set.
        A new session for the same learner and cohort voids their earlier unpaid one.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cohort_id], properties: { cohort_id: { type: string } } } } } }
      responses:
        "201":
          description: Session
          content: { application/json: { schema: { type: object, required: [payment, checkout_url], properties: { payment: { $ref: "#/components/schemas/Payment" }, checkout_url: { type: string, format: uri } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /payments/{id}:
    get:
      summary: One payment with its enrolment. The payer or an ADMIN only (404 for anyone else)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                type: object
                required: [payment, enrolment, cohort_id, training_slug]
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
                  enrolment: { $ref: "#/components/schemas/Enrolment" }
                  cohort_id: { type: string }
                  training_slug: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /me/enrolments:
    get:
      summary: The signed-in LEARNER's enrolments with training and cohort (TRN-7, COH-4)
      description: |
        CONFIRMED enrolments, plus REFUNDED ones whose cohort was CANCELLED (so the learner sees what happened).
        ARCHIVED trainings are included. Sorted by cohort start date.
      responses:
        "200":
          description: List
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LearnerEnrolment" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/payments:
    get:
      summary: The signed-in LEARNER's payments, newest first, without VOIDED (abandoned) attempts (PAY-6)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: List
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Payment" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error body per CONVENTIONS.md
      content: { application/json: { schema: { $ref: "./catalog.yaml#/components/schemas/Error" } } }
  schemas:
    PriceBreakdown:
      type: object
      description: PRC-7. Shown as-is; discount and tax stay 0 until PRC-6 (Phase 3). total = subtotal − discount + tax.
      required: [currency, unit_price, quantity, subtotal, discount, tax, total]
      properties:
        currency: { type: string }
        unit_price: { $ref: "./catalog.yaml#/components/schemas/Price" }
        quantity: { type: integer, minimum: 1 }
        subtotal: { type: integer, minimum: 0 }
        discount: { type: integer, minimum: 0 }
        tax: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    CohortCheckout:
      type: object
      required: [cohort, training, breakdown, blocked]
      properties:
        cohort: { $ref: "./cohorts.yaml#/components/schemas/PublicCohort" }
        training: { $ref: "./catalog.yaml#/components/schemas/PublicTrainingCard" }
        breakdown: { oneOf: [{ $ref: "#/components/schemas/PriceBreakdown" }, { type: "null" }] }
        blocked: { type: [string, "null"], enum: [FULL, NOT_OPEN, DEADLINE_PASSED, ALREADY_ENROLLED, NO_PRICE, null] }
    Enrolment:
      type: object
      required: [id, learner_id, training_id, cohort_id, status, price, payment_id, created_at, confirmed_at]
      properties:
        id: { type: string }
        learner_id: { type: string }
        training_id: { type: string }
        cohort_id: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, REFUNDED] }
        price: { $ref: "./catalog.yaml#/components/schemas/Price", description: "BR-4: frozen at purchase" }
        payment_id: { type: string }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
    Payment:
      type: object
      required: [id, learner_id, enrolment_id, description, breakdown, status, method, failure_message, refunded_amount, created_at, captured_at, receipt_number, receipt_url]
      properties:
        id: { type: string }
        learner_id: { type: string }
        enrolment_id: { type: string }
        description: { type: string, description: "Training title · cohort name" }
        breakdown: { $ref: "#/components/schemas/PriceBreakdown" }
        status: { type: string, enum: [PENDING, AUTHORISED, CAPTURED, VOIDED, FAILED, PARTIALLY_REFUNDED, REFUNDED] }
        method: { type: [string, "null"], description: From the gateway, e.g. "Visa ending 4242" }
        failure_message: { type: [string, "null"], description: Shown to the learner as-is }
        refunded_amount: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        captured_at: { type: [string, "null"], format: date-time }
        receipt_number: { type: [string, "null"], description: "Set on capture, e.g. EB-2026-00042" }
        receipt_url: { type: [string, "null"], description: Signed URL of the emailed PDF receipt }
    LearnerEnrolment:
      type: object
      required: [enrolment, training, cohort]
      properties:
        enrolment: { $ref: "#/components/schemas/Enrolment" }
        training:
          type: object
          required: [id, slug, title, status, category_name]
          properties:
            id: { type: string }
            slug: { type: string }
            title: { type: string }
            status: { type: string, enum: [PUBLISHED, ARCHIVED, DRAFT] }
            category_name: { type: string }
        cohort: { $ref: "./cohorts.yaml#/components/schemas/PublicCohort" }
