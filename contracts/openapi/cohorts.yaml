openapi: 3.1.0
info:
  title: "EduBridge LMP API: Cohorts"
  version: 0.1.0
  description: |
    Cohorts under a cohort-modality training (COH-1..3). Zod mirror: src/lib/api/schemas/cohort.ts
    and PublicCohort in schemas/catalog.ts. Mock: src/mocks/handlers/catalog.ts, cohorts.ts.

    Rules:
    - Schedule is stored in the instructor's zone (`schedule.timezone`); the backend expands it into
      dated sessions (COH-4). All instants in responses are UTC.
    - Status flow COH-3, see src/lib/domain/cohort-machine.ts. Guests see OPEN, FULL, CLOSED and IN_PROGRESS.
    - Enrolment allowed only when OPEN, enrolled_count < capacity and before enrolment_deadline (COH-2).
      The backend moves OPEN → FULL when the last seat is paid, and FULL → OPEN when a seat frees.
    - `price` is the price a learner would pay now; the enrolment stores the price paid (BR-4).
servers:
  - url: /api/v1
paths:
  /catalog/cohorts/{id}:
    get:
      summary: One visible cohort with its training, for the checkout page (COH-2, PAY-2)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Cohort and training card
          content:
            application/json:
              schema:
                type: object
                required: [cohort, training]
                properties:
                  cohort: { $ref: "#/components/schemas/PublicCohort" }
                  training: { $ref: "./catalog.yaml#/components/schemas/PublicTrainingCard" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/cohorts:
    get:
      summary: All cohorts with training title and instructor name (ADMIN)
      parameters:
        - { name: training_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CohortStatus" } }
      responses:
        "200":
          description: List, by start date
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminCohort" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a DRAFT cohort (COH-1). Admin only for now; plan §8 Q8 asks whether instructors may too
      description: |
        422 (field_errors) when: the training isn't a COHORT-modality training or is ARCHIVED (training_id);
        the instructor isn't assigned to the training (instructor_id); no class falls between the dates
        (schedule.weekdays); the deadline is after the first class (enrolment_deadline); the first class is
        in the past (start_date). The server computes session_count and first_session_at. Audited (ADM-5).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CohortInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/AdminCohortResponse" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/cohorts/{id}:
    patch:
      summary: Edit a cohort (full body)
      description: |
        DRAFT/OPEN/FULL/CLOSED: everything except training_id. IN_PROGRESS: only name and capacity
        (409 COHORT_LOCKED otherwise). COMPLETED/CANCELLED: 409 COHORT_LOCKED.
        capacity can't go below enrolled_count (422 capacity). Raising capacity on a FULL cohort moves it to OPEN;
        lowering it to enrolled_count on an OPEN cohort moves it to FULL. Enrolled learners are notified of
        date/schedule changes (NTF-1).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CohortInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/AdminCohortResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/cohorts/{id}/{action}:
    post:
      summary: Status change (COH-3)
      description: |
        open → OPEN (from DRAFT; 409 TRAINING_NOT_PUBLISHED, 409 DEADLINE_PASSED),
        close → CLOSED, start → IN_PROGRESS, complete → COMPLETED, cancel → CANCELLED.
        FULL is never set by hand. Disallowed moves: 409 INVALID_TRANSITION (see cohort-machine.ts).
        cancel needs body { reason } (≥ 5 chars, 422 reason). It refunds every CONFIRMED enrolment in full to the
        original payment method, marks enrolments REFUNDED, sets enrolled_count 0, and emails each learner the
        reason and amount (COH-5, PAY-5). Must be safe to retry: a second cancel returns 409, never a second refund.
        COH-5 automatic cancellation (scheduled job): at enrolment_deadline, an OPEN, FULL or CLOSED cohort with
        enrolled_count < min_enrolment is cancelled with the reason "Not enough learners enrolled by the deadline for this
        cohort to go ahead.", same effects as cancel; the instructor is notified and the audit entry's actor is "System"
        (action cohort.auto_cancel). Mirrors minimumShortfall() in src/lib/domain/cohort-machine.ts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [open, close, start, complete, cancel] } }
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 300 } } } } } }
      responses:
        "200": { $ref: "#/components/responses/AdminCohortResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  responses:
    AdminCohortResponse:
      description: Cohort
      content: { application/json: { schema: { type: object, required: [cohort], properties: { cohort: { $ref: "#/components/schemas/AdminCohort" } } } } }
    Error:
      description: Error body per CONVENTIONS.md
      content: { application/json: { schema: { $ref: "./catalog.yaml#/components/schemas/Error" } } }
  schemas:
    Weekday: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
    CohortStatus: { type: string, enum: [DRAFT, OPEN, FULL, CLOSED, IN_PROGRESS, COMPLETED, CANCELLED] }
    CohortSchedule:
      type: object
      required: [weekdays, start_time, duration_min, timezone]
      properties:
        weekdays: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Weekday" } }
        start_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "24-hour local time in `timezone`" }
        duration_min: { type: integer, minimum: 15, maximum: 480 }
        timezone: { type: string, description: IANA zone, e.g. Africa/Lagos }
    Cohort:
      type: object
      required: [id, training_id, name, start_date, end_date, schedule, session_count, first_session_at, capacity, min_enrolment, enrolled_count, enrolment_deadline, status, instructor_id]
      properties:
        id: { type: string }
        training_id: { type: string }
        name: { type: string }
        start_date: { type: string, format: date, description: In the schedule's zone }
        end_date: { type: string, format: date }
        schedule: { $ref: "#/components/schemas/CohortSchedule" }
        session_count: { type: integer, minimum: 0 }
        first_session_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        min_enrolment: { type: [integer, "null"], minimum: 1, description: "COH-5: below this at the deadline, cancel and refund" }
        enrolled_count: { type: integer, minimum: 0 }
        enrolment_deadline: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CohortStatus" }
        instructor_id: { type: string }
    AdminCohort:
      allOf:
        - { $ref: "#/components/schemas/Cohort" }
        - { type: object, required: [training_title, instructor_name], properties: { training_title: { type: string }, instructor_name: { type: string } } }
    CohortInput:
      type: object
      required: [training_id, instructor_id, name, start_date, end_date, schedule, capacity, min_enrolment, enrolment_deadline]
      properties:
        training_id: { type: string }
        instructor_id: { type: string }
        name: { type: string, minLength: 3, maxLength: 60 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: ">= start_date" }
        schedule: { $ref: "#/components/schemas/CohortSchedule" }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        min_enrolment: { type: [integer, "null"], minimum: 1, description: "<= capacity" }
        enrolment_deadline: { type: string, format: date-time, description: "UTC; the UI sends 23:59 on the chosen day in schedule.timezone. Must be <= the first class." }
    PublicCohort:
      description: Cohort without training_id, plus the current price and the instructor
      type: object
      required: [id, name, start_date, end_date, schedule, session_count, first_session_at, capacity, min_enrolment, enrolled_count, enrolment_deadline, status, instructor_id, price, instructor]
      properties:
        id: { type: string }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        schedule: { $ref: "#/components/schemas/CohortSchedule" }
        session_count: { type: integer }
        first_session_at: { type: string, format: date-time }
        capacity: { type: integer }
        min_enrolment: { type: [integer, "null"] }
        enrolled_count: { type: integer }
        enrolment_deadline: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CohortStatus" }
        instructor_id: { type: string }
        price: { oneOf: [{ $ref: "./catalog.yaml#/components/schemas/Price" }, { type: "null" }] }
        instructor: { $ref: "./catalog.yaml#/components/schemas/PublicInstructor" }
