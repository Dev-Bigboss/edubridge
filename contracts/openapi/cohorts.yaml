openapi: 3.1.0
info:
  title: "EduBridge LMP API: Cohorts"
  version: 0.1.0
  description: |
    Cohorts under a cohort-modality training (COH-1..3). Zod mirror: src/lib/api/schemas/cohort.ts
    and PublicCohort in schemas/catalog.ts. Mock: src/mocks/handlers/catalog.ts.

    Rules:
    - Schedule is stored in the instructor's zone (`schedule.timezone`); the backend expands it into
      dated sessions (COH-4). All instants in responses are UTC.
    - Status flow COH-3, see src/lib/domain/cohort-machine.ts. Guests see OPEN, FULL, CLOSED and IN_PROGRESS.
    - Enrolment allowed only when OPEN, enrolled_count < capacity and before enrolment_deadline (COH-2).
      The backend moves OPEN → FULL when the last seat is paid, and FULL → OPEN when a seat frees.
    - `price` is the price a learner would pay now; the enrolment stores the price paid (BR-4).
servers:
  - url: /api/v1
paths:
  /catalog/cohorts/{id}:
    get:
      summary: One visible cohort with its training, for the checkout page (COH-2, PAY-2)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Cohort and training card
          content:
            application/json:
              schema:
                type: object
                required: [cohort, training]
                properties:
                  cohort: { $ref: "#/components/schemas/PublicCohort" }
                  training: { $ref: "./catalog.yaml#/components/schemas/PublicTrainingCard" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error body per CONVENTIONS.md
      content: { application/json: { schema: { $ref: "./catalog.yaml#/components/schemas/Error" } } }
  schemas:
    Weekday: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
    CohortStatus: { type: string, enum: [DRAFT, OPEN, FULL, CLOSED, IN_PROGRESS, COMPLETED, CANCELLED] }
    CohortSchedule:
      type: object
      required: [weekdays, start_time, duration_min, timezone]
      properties:
        weekdays: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Weekday" } }
        start_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "24-hour local time in `timezone`" }
        duration_min: { type: integer, minimum: 15, maximum: 480 }
        timezone: { type: string, description: IANA zone, e.g. Africa/Lagos }
    Cohort:
      type: object
      required: [id, training_id, name, start_date, end_date, schedule, session_count, first_session_at, capacity, min_enrolment, enrolled_count, enrolment_deadline, status, instructor_id]
      properties:
        id: { type: string }
        training_id: { type: string }
        name: { type: string }
        start_date: { type: string, format: date, description: In the schedule's zone }
        end_date: { type: string, format: date }
        schedule: { $ref: "#/components/schemas/CohortSchedule" }
        session_count: { type: integer, minimum: 0 }
        first_session_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        min_enrolment: { type: [integer, "null"], minimum: 1, description: "COH-5: below this at the deadline, cancel and refund" }
        enrolled_count: { type: integer, minimum: 0 }
        enrolment_deadline: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CohortStatus" }
        instructor_id: { type: string }
    PublicCohort:
      description: Cohort without training_id, plus the current price and the instructor
      type: object
      required: [id, name, start_date, end_date, schedule, session_count, first_session_at, capacity, min_enrolment, enrolled_count, enrolment_deadline, status, instructor_id, price, instructor]
      properties:
        id: { type: string }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        schedule: { $ref: "#/components/schemas/CohortSchedule" }
        session_count: { type: integer }
        first_session_at: { type: string, format: date-time }
        capacity: { type: integer }
        min_enrolment: { type: [integer, "null"] }
        enrolled_count: { type: integer }
        enrolment_deadline: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CohortStatus" }
        instructor_id: { type: string }
        price: { oneOf: [{ $ref: "./catalog.yaml#/components/schemas/Price" }, { type: "null" }] }
        instructor: { $ref: "./catalog.yaml#/components/schemas/PublicInstructor" }
