openapi: 3.1.0
info:
  title: "EduBridge LMP API: Platform settings and audit log"
  version: 0.1.0
  description: |
    ADM-3 configuration (commission, 1:1 request expiry, cancellation policies; categories, modalities and
    pricing live in catalog.yaml / pricing.yaml) and the ADM-5 audit log. ADMIN only (403 otherwise).
    Zod mirror: src/lib/api/schemas/settings.ts, admin-users.ts (AuditPage). Mock: src/mocks/handlers/settings.ts.
    Rules mirrored in src/lib/domain/policy.ts.

    Settings rules:
    - Saved as a new version every time (PUT with the current `version`, else 409 VERSION_CONFLICT). Old versions
      are kept: a booking or payment uses the version in force when it was made, like prices (BR-4).
    - Learner cancellation tiers: distinct `min_hours_before`, one tier at 0, refund never higher for later
      notice (422 with field_errors keyed `learner_cancellation.tiers.{i}.{field}`). Stored sorted, longest notice first.
    - Starting values (commission 20%, expiry 24 h [SRS default], 48 h → 100%, 24 h → 50%, 0 h → 0%, instructor
      cancels → 100%) are placeholders until the PO confirms them (plan §8 Q3). `updated_by` is null until then.
    - Every change writes an audit entry `settings.updated` whose summary says what changed (ADM-5).

    Audit log rules: append-only (no update/delete endpoints), newest first. Every admin write in every module
    adds an entry with actor, action, target and a human summary that includes any reason given.
servers:
  - url: /api/v1
paths:
  /admin/settings:
    get:
      summary: Current settings and version history (newest first)
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Save a new version (full body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SettingsInput" }
                - { type: object, required: [version], properties: { version: { type: integer, description: The version being edited } } }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/audit-log:
    get:
      summary: Audit entries, newest first, 25 per page
      parameters:
        - { name: q, in: query, description: Summary or target id contains, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string, examples: [user, training, cohort, pricing_rule, category, modality, settings] } }
        - { name: from, in: query, description: Inclusive calendar day (UTC), schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive calendar day (UTC), schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total, facets]
                properties:
                  items: { type: array, items: { $ref: "./admin-users.yaml#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
                  total: { type: integer }
                  facets:
                    type: object
                    required: [actors, target_types]
                    properties:
                      actors: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } }
                      target_types: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error body per CONVENTIONS.md
      content: { application/json: { schema: { $ref: "./catalog.yaml#/components/schemas/Error" } } }
    Settings:
      description: Settings with history
      content:
        application/json:
          schema:
            type: object
            required: [settings, history]
            properties:
              settings: { $ref: "#/components/schemas/PlatformSettings" }
              history:
                type: array
                items:
                  type: object
                  required: [version, updated_at, updated_by_name, summary]
                  properties:
                    version: { type: integer }
                    updated_at: { type: string, format: date-time }
                    updated_by_name: { type: string }
                    summary: { type: string }
  schemas:
    RefundTier:
      type: object
      required: [min_hours_before, refund_percent]
      properties:
        min_hours_before: { type: integer, minimum: 0, maximum: 720 }
        refund_percent: { type: integer, minimum: 0, maximum: 100 }
    SettingsInput:
      type: object
      required: [commission_percent, booking_expiry_hours, learner_cancellation, instructor_cancellation, recording_retention_months]
      properties:
        commission_percent: { type: number, minimum: 0, maximum: 50, description: PAY-7 }
        booking_expiry_hours: { type: integer, minimum: 1, maximum: 168, description: "OTO-5, SRS default 24" }
        learner_cancellation:
          type: object
          required: [tiers]
          properties: { tiers: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/RefundTier" } } }
        instructor_cancellation:
          type: object
          required: [refund_percent]
          properties: { refund_percent: { type: integer, minimum: 0, maximum: 100 } }
        recording_retention_months: { type: integer, minimum: 1, maximum: 60, description: "REC-5; placeholder 12 until plan §8 Q6 is answered" }
    PlatformSettings:
      allOf:
        - { $ref: "#/components/schemas/SettingsInput" }
        - type: object
          required: [version, updated_at, updated_by]
          properties:
            version: { type: integer, minimum: 1 }
            updated_at: { type: string, format: date-time }
            updated_by:
              oneOf:
                - { type: "null" }
                - { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
